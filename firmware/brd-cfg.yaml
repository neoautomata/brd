packages:
  brd: !include
    file: brd/firmware/brd-tmpl.yaml
    vars:
      name: brd
      short_sleep_time: 15
      sleep_at_hr: 22
      sleep_at_min: 0
      wake_at_hr: 7
      wake_at_min: 0
      local_timezone: UTC
      ntp_server: ""
      image_url_raw: http://example.com/img
      image_url_raw_sha: http://example.com/img.sha
      vlogs_host: ""
      vmetrics_host: ""

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      manual_ip:
        static_ip: 192.0.2.10
        gateway: 192.0.2.1
        subnet: 255.255.255.0
        dns1: 192.0.2.1

web_server:
  port: 80
  auth:
    username: admin
    password: !secret web_password

ota:
  - platform: esphome
    id: !extend brd_ota
    password: !secret ota_password
