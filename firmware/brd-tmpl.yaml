defaults:
  name: brd
  brd_dir: brd/firmware
  short_sleep_time: 15
  sleep_at_hr: 22
  sleep_at_min: 0
  wake_at_hr: 7
  wake_at_min: 0
  min_awake_sec: 30
  max_battery_awake_sec: 180
  usb_refresh_interval_min: 5
  periodic_refresh_after_sec: 240
  wifi_connect_timeout_sec: 90
  rtc_i2c_addr: 0x51
  wifi_output_power: 12.0
  local_timezone: UTC
  ntp_server: ""
  image_url_raw: ""
  image_url_raw_sha: ""
  vlogs_host: ""
  vmetrics_host: ""

packages:
  lilygo_t5_47_plus: github://hbast/lilygo_t5_47_plus/packages/lilygo_t5_47_plus.yaml@v1.0.0

esphome:
  name: ${name}
  min_version: 2026.3.0
  includes:
    - ${brd_dir}/brd_blit.h
    - ${brd_dir}/brd_schedule.h
    - ${brd_dir}/brd_rtc.h
    - ${brd_dir}/brd_power.h
  platformio_options:
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
  on_shutdown:
    - priority: -100.0
      then:
        - lambda: |-
            if (brd_power::entering_deep_sleep) {
              brd_power::lock_epd_and_holds_for_deep_sleep();
            }
  on_boot:
    - priority: 900.0
      then:
        - lambda: |-
            esp_sleep_wakeup_cause_t wakeup_reason = esp_sleep_get_wakeup_cause();
            uint64_t wakeup_pin_mask = 0;
            if (wakeup_reason == ESP_SLEEP_WAKEUP_EXT1) {
              wakeup_pin_mask = esp_sleep_get_ext1_wakeup_status();
            }
            int cause_code = 0;
            if (wakeup_reason == ESP_SLEEP_WAKEUP_EXT1) {
              cause_code = 3;
            } else if (wakeup_reason == ESP_SLEEP_WAKEUP_TIMER) {
              cause_code = 4;
            }
            id(boot_wakeup_cause) = cause_code;
            id(boot_ext1_mask) = wakeup_pin_mask;

            // Release deep-sleep GPIO holds and check saved RTC state.
            brd_power::release_sleep_holds_on_boot();
            brd_power::rtc_state.validate_or_reset();
            id(boot_prev_slept) = brd_power::rtc_state.prev_slept;
            brd_power::rtc_state.boot_count++;
            brd_power::rtc_state.update_crc();
    - priority: 250.0
      then:
        - lambda: |-
            // Clear status flags on hardware RTC and disable clock output.
            brd_rtc::EspHomeI2cAdapter i2c_bus(id(lilygo_t5_47_plus_i2c));
            brd_rtc::RtcStatus rtc_status;
            if (!brd_rtc::read_and_clear_status_and_disable_clkout(i2c_bus, ${rtc_i2c_addr}, rtc_status)) {
              ESP_LOGW("rtc", "The firmware failed to read or clear the hardware RTC status.");
            }
            id(rtc_time).read_time();

            const char *classified_reason = brd_power::classify_wake_reason(
                id(boot_wakeup_cause), id(boot_ext1_mask), rtc_status.alarm_flag, rtc_status.timer_flag);
            id(wake_reason).publish_state(classified_reason);

            id(is_button_wake) = (id(boot_wakeup_cause) == 3 && (id(boot_ext1_mask) & (1ULL << 21)));
            id(wake_touch_x) = -1;
            id(wake_touch_y) = -1;

            brd_power::rtc_state.staying_awake_usb = brd_power::check_usb_sof_incremented();
            brd_power::rtc_state.update_crc();

            if (brd_power::rtc_state.staying_awake_usb) {
              ESP_LOGI("power", "USB power is active. The device stays awake.");
            }
        - script.execute: sleep_watchdog
    - priority: 200.0
      then:
        - script.execute: sample_batt
    - priority: 150.0
      then:
        - lambda: |-
            if (std::strlen("${ntp_server}") > 0) {
              if (esp_sntp_enabled()) {
                esp_sntp_stop();
              }
              esp_sntp_setservername(0, "${ntp_server}");
              esp_sntp_init();
              ESP_LOGI("time", "The firmware set the primary SNTP server to %s.", "${ntp_server}");
            }

globals:
  - id: boot_wakeup_cause
    type: int
    initial_value: '0'
  - id: boot_ext1_mask
    type: uint64_t
    initial_value: '0'
  - id: boot_prev_slept
    type: bool
    initial_value: 'false'
  - id: next_wake_is_overnight
    type: bool
    initial_value: 'false'
  - id: image_download_complete
    type: bool
    initial_value: 'false'
  - id: image_is_new
    type: bool
    initial_value: 'false'
  - id: image_failed
    type: bool
    initial_value: 'false'
  - id: forced_refresh
    type: bool
    initial_value: 'false'
  - id: refresh_pending
    type: bool
    initial_value: 'false'
  - id: pending_img_hash
    type: std::string
    initial_value: '""'
  - id: wake_touch_x
    type: int
    initial_value: '-1'
  - id: wake_touch_y
    type: int
    initial_value: '-1'
  - id: is_button_wake
    type: bool
    initial_value: 'false'
  - id: next_wake_epoch
    type: int64_t
    initial_value: '0'
  - id: next_wake_alarm
    type: bool
    initial_value: 'false'
  - id: sleep_seconds
    type: uint32_t
    initial_value: '0'
  - id: ntp_sync_requested
    type: bool
    initial_value: 'false'
  - id: ntp_synced_this_run
    type: bool
    initial_value: 'false'
  - id: rtc_saved_this_run
    type: bool
    initial_value: 'false'
  - id: rtc_clock_diverged
    type: bool
    initial_value: 'false'
  - id: ota_lock_held
    type: bool
    initial_value: 'false'

ota:
  - platform: esphome
    id: brd_ota
    on_begin:
      then:
        - lambda: |-
            if (!id(ota_lock_held)) {
              id(ota_lock_held) = true;
              brd_power::acquire_sleep_lock();
            }
            ESP_LOGI("ota", "The device started an OTA update and locked deep sleep.");
    on_end:
      then:
        - lambda: |-
            if (id(ota_lock_held)) {
              id(ota_lock_held) = false;
              brd_power::release_sleep_lock();
            }
            ESP_LOGI("ota", "The device finished the OTA update and unlocked deep sleep.");
    on_abort:
      then:
        - lambda: |-
            if (id(ota_lock_held)) {
              id(ota_lock_held) = false;
              brd_power::release_sleep_lock();
            }
            ESP_LOGW("ota", "The device aborted the OTA update and unlocked deep sleep.");
    on_error:
      then:
        - lambda: |-
            if (id(ota_lock_held)) {
              id(ota_lock_held) = false;
              brd_power::release_sleep_lock();
            }
            ESP_LOGW("ota", "The OTA update failed with code %u. The device unlocked deep sleep.",
                     (unsigned) x);

wifi:
  fast_connect: true
  power_save_mode: light
  output_power: ${wifi_output_power}
  on_connect:
    - script.execute: wifi_connect_flow

logger:
  hardware_uart: USB_SERIAL_JTAG

http_request:
  id: http_client
  useragent: "ESPHome-${name}"
  timeout: 10s

button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "Refresh"
    icon: "mdi:update"
    on_press:
      then:
        - lambda: |-
            id(forced_refresh) = true;
            id(refresh_pending) = true;
        - script.execute: brd_image_task

binary_sensor:
  - platform: template
    name: "Image Refreshed"
    id: image_refreshed
    device_class: occupancy

text_sensor:
  - platform: template
    name: "Wake Reason"
    id: wake_reason
    icon: "mdi:power-sleep"

sensor:
  - platform: template
    name: "Battery Voltage"
    id: batt_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: "voltage"
    state_class: "measurement"
    update_interval: never

  - platform: template
    name: "Battery Level"
    id: batt_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: "battery"
    state_class: "measurement"
    update_interval: never

  - platform: template
    name: "Wake Touch X"
    id: wake_touch_x_sensor
    unit_of_measurement: "px"

  - platform: template
    name: "Wake Touch Y"
    id: wake_touch_y_sensor
    unit_of_measurement: "px"

  - platform: template
    name: "Awake Duration"
    id: awake_duration_sensor
    unit_of_measurement: "s"
    accuracy_decimals: 1
    device_class: duration

time:
  - platform: pcf8563
    id: rtc_time
    timezone: ${local_timezone}
    i2c_id: lilygo_t5_47_plus_i2c
    address: ${rtc_i2c_addr}
    update_interval: never

  - platform: sntp
    id: ntp_time
    timezone: ${local_timezone}
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org
    on_time_sync:
      then:
        - lambda: |-
            // Ignore the initial boot callback that the hardware RTC emits.
            if (sntp_get_sync_status() != SNTP_SYNC_STATUS_COMPLETED) {
              ESP_LOGD("time", "The firmware ignored a non-SNTP time sync callback.");
              return;
            }
            // Write network time to the hardware RTC and clear any stale wake plan.
            auto ntp_now = id(ntp_time).now();
            if (ntp_now.is_valid()) {
              id(ntp_synced_this_run) = true;
              id(rtc_saved_this_run) = false;
              id(next_wake_epoch) = 0;
              id(next_wake_alarm) = false;
              brd_rtc::EspHomeI2cAdapter i2c_bus(id(lilygo_t5_47_plus_i2c));
              brd_rtc::UtcClock clk;
              time_t ts = ntp_now.timestamp;
              struct tm tm_buf;
              if (gmtime_r(&ts, &tm_buf) != nullptr) {
                clk.year = tm_buf.tm_year + 1900;
                clk.month = tm_buf.tm_mon + 1;
                clk.day = tm_buf.tm_mday;
                clk.weekday = static_cast<uint8_t>(tm_buf.tm_wday + 1);
                clk.hour = tm_buf.tm_hour;
                clk.minute = tm_buf.tm_min;
                clk.second = tm_buf.tm_sec;
                if (brd_rtc::write_utc_clock_only(i2c_bus, ${rtc_i2c_addr}, clk)) {
                  brd_power::rtc_state.last_rtc_sync_epoch = static_cast<uint32_t>(ntp_now.timestamp);
                  brd_power::rtc_state.update_crc();
                  id(rtc_saved_this_run) = true;
                  id(rtc_clock_diverged) = false;
                  ESP_LOGI("time", "The firmware saved network time to the hardware RTC.");
                } else {
                  id(rtc_clock_diverged) = true;
                  ESP_LOGW("time", "The firmware failed to save network time to the hardware RTC.");
                }
              } else {
                id(rtc_clock_diverged) = true;
              }
            }

deep_sleep:
  id: deep_sleep_1
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - GPIO21
      - GPIO09

interval:
  - interval: 10s
    then:
      - if:
          condition:
            lambda: 'return brd_power::rtc_state.staying_awake_usb;'
          then:
            - script.execute: sample_batt
            - lambda: |-
                const uint32_t batt_mv = brd_power::voltage_to_mv(id(batt_voltage).state);
                const bool sof_inc = brd_power::check_usb_sof_incremented();
                const bool still_awake = brd_power::evaluate_usb_power(
                    batt_mv, brd_power::rtc_state.prev_batt_mv, true, sof_inc, id(boot_prev_slept));
                if (!still_awake) {
                  brd_power::rtc_state.staying_awake_usb = false;
                  brd_power::rtc_state.update_crc();
                  ESP_LOGI("power", "USB power disconnected. The device prepares deep sleep.");
                }
            - if:
                condition:
                  and:
                    - lambda: 'return !brd_power::rtc_state.staying_awake_usb;'
                    - or:
                        - lambda: 'return id(image_download_complete);'
                        - lambda: 'return !id(sleep_watchdog).is_running();'
                then:
                  - script.execute: usb_disconnect_sleep

  - interval: ${usb_refresh_interval_min}min
    then:
      - if:
          condition:
            and:
              - lambda: 'return millis() >= ${periodic_refresh_after_sec} * 1000UL;'
              - wifi.connected:
              - lambda: 'return brd_power::rtc_state.staying_awake_usb;'
          then:
            - logger.log: "The device starts a periodic refresh on USB power."
            - script.execute: brd_image_task

  - interval: 30s
    then:
      - if:
          condition:
            and:
              - lambda: 'return !brd_power::rtc_state.staying_awake_usb;'
              - lambda: 'return millis() >= ${max_battery_awake_sec} * 1000UL;'
              - lambda: 'return !id(enter_sleep).is_running();'
              - lambda: 'return !brd_power::is_sleep_locked();'
          then:
            - logger.log: "The device reached the battery awake limit. Starting deep sleep."
            - script.execute: enter_sleep

script:
  - id: usb_disconnect_sleep
    mode: single
    then:
      - wait_until:
          condition:
            lambda: 'return !id(brd_image_task).is_running() && !brd_power::epd_refresh_active && !brd_power::is_sleep_locked();'
          timeout: 30s
      - if:
          condition:
            lambda: 'return !brd_power::rtc_state.staying_awake_usb;'
          then:
            - script.execute: plan_next_wake
            - script.execute: enter_sleep

  - id: wifi_connect_flow
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(enter_sleep).is_running();'
          then:
            - logger.log: "The sleep sequence is active. The device ignores WiFi reconnect."
            - script.stop: wifi_connect_flow
      - lambda: |-
          id(image_download_complete) = false;
          id(image_failed) = false;
      - script.execute: sample_batt
      - lambda: |-
          const uint32_t current_mv = brd_power::voltage_to_mv(id(batt_voltage).state);
          const bool sof_inc = brd_power::check_usb_sof_incremented();
          brd_power::rtc_state.staying_awake_usb = brd_power::evaluate_usb_power(
              current_mv, brd_power::rtc_state.prev_batt_mv, brd_power::rtc_state.staying_awake_usb,
              sof_inc, id(boot_prev_slept));
          brd_power::rtc_state.update_crc();
          if (brd_power::rtc_state.staying_awake_usb) {
            ESP_LOGI("power", "USB power is active. The device stays awake.");
          }
      - lambda: |-
          // Sync network time when the hardware RTC clock is invalid or stale.
          if (!id(ntp_synced_this_run) && !id(rtc_time).now().is_valid()) {
            id(rtc_time).read_time();
          }
          auto rtc_now = id(rtc_time).now();
          const uint32_t current_epoch = rtc_now.is_valid() ? static_cast<uint32_t>(rtc_now.timestamp) : 0U;
          if (id(ntp_synced_this_run)) {
            ESP_LOGI("time", "SNTP synchronized earlier during this wake.");
          } else if (brd_power::is_rtc_sync_due(rtc_now.is_valid(), current_epoch,
                                                brd_power::rtc_state.last_rtc_sync_epoch)) {
            id(ntp_sync_requested) = true;
            ESP_LOGI("time", "The firmware requests an SNTP time update.");
            if (esp_sntp_enabled()) {
              esp_sntp_restart();
            } else {
              esp_sntp_init();
            }
          } else {
            ESP_LOGI("time", "The hardware RTC is current. The firmware skips SNTP sync.");
          }
      - if:
          condition:
            lambda: 'return id(ntp_sync_requested) && !id(ntp_synced_this_run);'
          then:
            - wait_until:
                condition:
                  lambda: 'return id(ntp_synced_this_run);'
                timeout: 5s
            - lambda: |-
                if (!id(ntp_synced_this_run)) {
                  ESP_LOGW("time", "The SNTP time update exceeded the timeout.");
                }
      - script.execute: plan_next_wake
      - script.execute: brd_image_task
      - wait_until:
          condition:
            lambda: 'return id(image_download_complete);'
          timeout: 30s
      - logger.log: "The firmware finished the image task."
      - if:
          condition:
            lambda: 'return !brd_power::rtc_state.staying_awake_usb && !id(enter_sleep).is_running();'
          then:
            - script.execute: enter_sleep

  - id: sample_batt
    mode: single
    then:
      - lambda: |-
          const float v = brd_power::sample_battery_rails_only();
          if (std::isfinite(v)) {
            id(batt_voltage).publish_state(v);
            const float pct = brd_power::battery_voltage_to_percent(v);
            id(batt_level).publish_state(pct);
          } else {
            ESP_LOGW("batt", "The firmware skipped battery sampling or read an invalid value.");
          }

  - id: brd_image_task
    mode: single
    then:
      - lambda: |-
          brd_power::acquire_sleep_lock();
          id(refresh_pending) = true;
      - while:
          condition:
            lambda: 'return id(refresh_pending);'
          then:
            - lambda: 'id(refresh_pending) = false;'
            - logger.log: "The firmware checks the image version."
            - lambda: |-
                id(image_is_new) = false;
                id(image_failed) = false;
                id(pending_img_hash).clear();
                const bool force_this_run = id(forced_refresh);
                id(forced_refresh) = false;

                if (std::strlen("${image_url_raw_sha}") == 0 || std::strlen("${image_url_raw}") == 0) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The configuration omits the image URLs.");
                  return;
                }

                auto sha_container = id(http_client).get("${image_url_raw_sha}");
                if (sha_container == nullptr) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The HTTP GET request failed for %s.", "${image_url_raw_sha}");
                  return;
                }
                if (sha_container->status_code != 200) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The image version check failed with HTTP status %d.",
                           sha_container->status_code);
                  sha_container->end();
                  return;
                }

                char hash_buf[80];
                const auto sha_res = http_request::http_read_fully(
                    sha_container.get(), reinterpret_cast<uint8_t *>(hash_buf),
                    sizeof(hash_buf) - 1, sizeof(hash_buf) - 1, id(http_client).get_timeout());
                const size_t hash_len = sha_container->get_bytes_read();
                const bool sha_complete = sha_container->is_read_complete();
                sha_container->end();

                if (sha_res.status != http_request::HttpReadStatus::OK || !sha_complete) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The image version read failed (status %d, bytes %u, complete %d).",
                           (int) sha_res.status, (unsigned) hash_len, sha_complete ? 1 : 0);
                  return;
                }

                char normalized_sha[65];
                if (!brd_blit::parse_and_normalize_sha256(hash_buf, hash_len, normalized_sha)) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The server sent an invalid SHA-256 digest.");
                  return;
                }

                // Compare with the saved digest unless the user requested a manual refresh.
                if (!force_this_run && strcmp(normalized_sha, brd_power::rtc_state.last_img_hash) == 0) {
                  ESP_LOGI("main", "Image %s did not change. The firmware skips the display refresh.",
                           normalized_sha);
                  id(image_is_new) = false;
                  id(image_refreshed).publish_state(false);
                  return;
                }

                auto img_container = id(http_client).get("${image_url_raw}");
                if (img_container == nullptr) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The HTTP GET request failed for %s.", "${image_url_raw}");
                  return;
                }
                if (img_container->status_code != 200) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The image download failed with HTTP status %d.",
                           img_container->status_code);
                  img_container->end();
                  return;
                }

                uint8_t *dst = brd_blit::framebuffer(id(t5_display));
                const size_t expected = brd_blit::framebuffer_size(id(t5_display));
                if (dst == nullptr || expected != brd_blit::FRAMEBUFFER_SIZE) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The display framebuffer size is invalid (%u bytes).",
                           (unsigned) expected);
                  img_container->end();
                  return;
                }
                if (!brd_blit::is_expected_content_length(img_container->content_length, expected)) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The server returned %u bytes instead of %u bytes.",
                           (unsigned) img_container->content_length, (unsigned) expected);
                  img_container->end();
                  return;
                }
                brd_blit::StagingBuffer stage(expected);
                if (!stage.valid()) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The firmware failed to allocate a %u-byte staging buffer.",
                           (unsigned) expected);
                  img_container->end();
                  return;
                }
                const auto read_res = http_request::http_read_fully(
                    img_container.get(), stage.data(), expected, 4096, id(http_client).get_timeout());
                const size_t got = img_container->get_bytes_read();

                bool oversized = false;
                if (read_res.status == http_request::HttpReadStatus::OK && got == expected &&
                    !img_container->is_read_complete()) {
                  uint8_t extra_byte = 0;
                  const auto eof_res = http_request::http_read_fully(
                      img_container.get(), &extra_byte, 1, 1, id(http_client).get_timeout());
                  if (eof_res.status != http_request::HttpReadStatus::OK ||
                      img_container->get_bytes_read() > expected) {
                    oversized = true;
                  }
                }
                img_container->end();

                if (read_res.status != http_request::HttpReadStatus::OK || got != expected) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The image download stopped after %u of %u bytes (status %d).",
                           (unsigned) got, (unsigned) expected, (int) read_res.status);
                  return;
                }
                if (oversized) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The image download exceeded %u bytes.", (unsigned) expected);
                  return;
                }
                // The firmware uses /img.sha only to detect image changes, not as a security check.
                // The firmware does not calculate SHA-256 on the device to save CPU time and power.
                if (brd_blit::copy_framebuffer(dst, expected, stage.data(), got) !=
                    brd_blit::BlitResult::OK) {
                  id(image_failed) = true;
                  ESP_LOGE("main", "The firmware failed to copy the image into the display buffer.");
                  return;
                }

                id(pending_img_hash) = normalized_sha;
                id(image_is_new) = true;
                id(image_refreshed).publish_state(true);
                ESP_LOGI("main", "The firmware loaded %u bytes into the display buffer.", (unsigned) got);
            - if:
                condition:
                  lambda: 'return id(image_is_new);'
                then:
                  - lambda: |-
                      esp_wifi_set_ps(WIFI_PS_MAX_MODEM);
                      brd_power::epd_refresh_active = true;
                  - component.update: t5_display
                  - lambda: |-
                      esp_wifi_set_ps(WIFI_PS_MIN_MODEM);
                      brd_power::epd_refresh_active = false;
                      brd_power::poweroff_epd_rails_idle();
                      if (id(pending_img_hash).size() == brd_blit::SHA256_HEX_LEN) {
                        strncpy(brd_power::rtc_state.last_img_hash, id(pending_img_hash).c_str(),
                                sizeof(brd_power::rtc_state.last_img_hash) - 1);
                        brd_power::rtc_state.last_img_hash[sizeof(brd_power::rtc_state.last_img_hash) - 1] = '\0';
                        brd_power::rtc_state.update_crc();
                        id(pending_img_hash).clear();
                      }
            - script.execute: report_run
      - lambda: |-
          id(image_download_complete) = true;
          brd_power::release_sleep_lock();
      - if:
          condition:
            lambda: 'return !brd_power::rtc_state.staying_awake_usb && !id(enter_sleep).is_running();'
          then:
            - script.execute: enter_sleep

  - id: plan_next_wake
    mode: single
    then:
      - lambda: |-
          const uint32_t fallback_sleep = std::max<uint32_t>(
              static_cast<uint32_t>(${short_sleep_time} > 0 ? ${short_sleep_time} : 1) * 60U,
              brd_schedule::MIN_FALLBACK_SLEEP_SEC);
          id(next_wake_epoch) = 0;
          id(next_wake_alarm) = false;
          id(sleep_seconds) = fallback_sleep;
          id(next_wake_is_overnight) = false;

          if (brd_power::rtc_state.staying_awake_usb) {
            ESP_LOGI("sleep", "USB power is active. The device skips deep sleep.");
            return;
          }

          auto local_time = id(ntp_time).now();
          if (!local_time.is_valid()) {
            local_time = id(rtc_time).now();
          }

          const int64_t now_epoch = local_time.is_valid() ? local_time.timestamp : 0;
          brd_schedule::EspHomeTzCalendar cal;
          brd_schedule::ScheduleConfig cfg;
          cfg.wake_hour = ${wake_at_hr};
          cfg.wake_minute = ${wake_at_min};
          cfg.sleep_hour = ${sleep_at_hr};
          cfg.sleep_minute = ${sleep_at_min};
          cfg.boundary_interval_min = ${short_sleep_time};
          cfg.fallback_sleep_sec = fallback_sleep;

          const auto plan = brd_schedule::plan_next_wake(cal, now_epoch, cfg);
          id(next_wake_epoch) = plan.target_epoch;
          id(next_wake_alarm) = plan.arm_alarm;
          id(sleep_seconds) = std::max<uint32_t>(plan.sleep_seconds, brd_schedule::MIN_FALLBACK_SLEEP_SEC);
          id(next_wake_is_overnight) = (strcmp(plan.mode, "alarm") == 0);

          ESP_LOGI("sleep", "Planned wake: mode=%s epoch=%" PRId64 " sleep_s=%" PRIu32 " arm_alarm=%d",
                   plan.mode, plan.target_epoch, id(sleep_seconds), plan.arm_alarm ? 1 : 0);

  - id: report_run
    mode: queued
    then:
      - lambda: |-
          auto now_local = id(ntp_time).now();
          if (!now_local.is_valid()) {
            now_local = id(rtc_time).now();
          }

          char now_buf[32];
          if (now_local.is_valid()) {
            now_local.strftime(now_buf, sizeof(now_buf), "%Y-%m-%dT%H:%M:%S%z");
          } else {
            snprintf(now_buf, sizeof(now_buf), "unknown");
          }

          const char *mode = "none";
          char next_buf[32];
          char next_in_buf[24];
          if (id(next_wake_epoch) != 0) {
            mode = id(next_wake_is_overnight) ? "alarm" : "timer";
            ESPTime next_local = ESPTime::from_epoch_local(static_cast<time_t>(id(next_wake_epoch)));
            next_local.strftime(next_buf, sizeof(next_buf), "%Y-%m-%dT%H:%M:%S%z");

            if (now_local.is_valid()) {
              const int64_t next_in = id(next_wake_epoch) -
                                      static_cast<int64_t>(now_local.timestamp);
              snprintf(next_in_buf, sizeof(next_in_buf), "%" PRId64, next_in);
            } else {
              snprintf(next_in_buf, sizeof(next_in_buf), "unknown");
            }
          } else {
            snprintf(next_buf, sizeof(next_buf), "unknown");
            snprintf(next_in_buf, sizeof(next_in_buf), "unknown");
          }

          const uint32_t now_epoch = now_local.is_valid() ? static_cast<uint32_t>(now_local.timestamp) : 0;
          char since_buf[24];
          int64_t since_num = -1;
          if (now_epoch != 0 && brd_power::rtc_state.prev_trace_epoch != 0 &&
              now_epoch >= brd_power::rtc_state.prev_trace_epoch) {
            since_num = static_cast<int64_t>(now_epoch - brd_power::rtc_state.prev_trace_epoch);
            snprintf(since_buf, sizeof(since_buf), "%" PRId64, since_num);
          } else {
            snprintf(since_buf, sizeof(since_buf), "unknown");
          }

          brd_power::TraceTelemetry telem;
          telem.wake_reason = id(wake_reason).state.empty() ? "unknown" : id(wake_reason).state.c_str();
          telem.mode = mode;
          telem.batt_v = id(batt_voltage).state;
          telem.batt_pct = id(batt_level).state;
          telem.awake_s = millis() / 1000.0f;
          telem.image_status = id(image_failed) ? "failed" : (id(image_is_new) ? "new" : "cached");
          telem.touch_x = id(wake_touch_x);
          telem.touch_y = id(wake_touch_y);
          telem.now_str = now_buf;
          telem.next_str = next_buf;
          telem.next_in_str = next_in_buf;
          telem.since_str = since_buf;
          telem.prev_slept = brd_power::rtc_state.prev_slept;
          telem.prev_gt911 = brd_power::rtc_state.prev_gt911;
          telem.boot_count = brd_power::rtc_state.boot_count;
          telem.job_name = "${name}";
          telem.since_num = since_num;
          telem.rtc_sync = brd_power::classify_rtc_sync_status(
              id(ntp_sync_requested), id(ntp_synced_this_run), id(rtc_saved_this_run));
          telem.rtc_sync_code = brd_power::classify_rtc_sync_metric(
              id(ntp_sync_requested), id(ntp_synced_this_run), id(rtc_saved_this_run));
          telem.rtc_sync_age_sec = brd_power::compute_rtc_sync_age(
              now_epoch, brd_power::rtc_state.last_rtc_sync_epoch);

          char line[384];
          const int line_len = brd_power::format_vlogs_message(line, sizeof(line), telem);
          if (line_len < 0 || static_cast<size_t>(line_len) >= sizeof(line)) {
            ESP_LOGW("trace", "The firmware truncated the telemetry log line (%d bytes).", line_len);
          }
          ESP_LOGI("trace", "%s", line);

          auto post = [](const char *what, const std::string &url, const std::string &body, const char *content_type) {
            std::vector<http_request::Header> headers;
            headers.push_back({"Content-Type", content_type});

            auto container = id(http_client).post(url, body, headers);
            if (container == nullptr) {
              ESP_LOGW("trace", "%s: the request to the telemetry host failed.", what);
            } else {
              if (container->status_code < 200 || container->status_code >= 300) {
                ESP_LOGW("trace", "%s: the telemetry host returned HTTP %d.", what, container->status_code);
              } else {
                ESP_LOGD("trace", "%s: the telemetry host returned %d.", what, container->status_code);
              }
              container->end();
            }
          };

          if (std::strlen("${vlogs_host}") > 0) {
            auto json = json::build_json([&](JsonObject root) {
              root["host"] = "${name}";
              root["message"] = line;
            });
            post("jsonline",
                 "${vlogs_host}/insert/jsonline?_stream_fields=host&_msg_field=message",
                 std::string(json.c_str(), json.size()), "application/stream+json");
          }

          if (std::strlen("${vmetrics_host}") > 0) {
            char prom[640];
            const int prom_len = brd_power::format_vmetrics_prometheus(prom, sizeof(prom), telem);
            if (prom_len > 0 && static_cast<size_t>(prom_len) < sizeof(prom)) {
              post("prometheus",
                   "${vmetrics_host}/api/v1/import/prometheus",
                   prom, "text/plain");
            } else {
              ESP_LOGW("trace", "The firmware truncated the Prometheus payload (%d bytes). The firmware skips the upload.", prom_len);
            }
          }

          const uint32_t current_batt_mv = brd_power::voltage_to_mv(id(batt_voltage).state);
          if (current_batt_mv > 0) {
            brd_power::rtc_state.prev_batt_mv = current_batt_mv;
          }
          if (now_epoch > 0) {
            brd_power::rtc_state.prev_trace_epoch = now_epoch;
          }
          brd_power::rtc_state.prev_slept = false;
          brd_power::rtc_state.prev_gt911 = -1;
          brd_power::rtc_state.update_crc();
          id(ntp_sync_requested) = false;
          id(ntp_synced_this_run) = false;
          id(rtc_saved_this_run) = false;
          id(wake_touch_x) = -1;
          id(wake_touch_y) = -1;

  - id: sleep_watchdog
    mode: single
    then:
      - delay: !lambda 'return ${wifi_connect_timeout_sec} * 1000UL;'
      - if:
          condition:
            and:
              - lambda: 'return !id(image_download_complete);'
              - lambda: 'return !id(brd_image_task).is_running() && !brd_power::epd_refresh_active && !brd_power::is_sleep_locked();'
              - not:
                  wifi.connected:
          then:
            - script.execute: sample_batt
            - lambda: |-
                const uint32_t batt_mv = brd_power::voltage_to_mv(id(batt_voltage).state);
                const bool sof_inc = brd_power::check_usb_sof_incremented();
                brd_power::rtc_state.staying_awake_usb = brd_power::evaluate_usb_power(
                    batt_mv, brd_power::rtc_state.prev_batt_mv, false, sof_inc, id(boot_prev_slept));
                brd_power::rtc_state.update_crc();
            - if:
                condition:
                  lambda: 'return !brd_power::rtc_state.staying_awake_usb;'
                then:
                  - logger.log: "WiFi connection exceeded the timeout. The device starts deep sleep."
                  - script.execute: plan_next_wake
                  - script.execute: enter_sleep
                else:
                  - logger.log: "WiFi connection exceeded the timeout on USB power. The device stays awake."

  - id: enter_sleep
    mode: single
    then:
      - if:
          condition:
            lambda: 'return brd_power::rtc_state.staying_awake_usb;'
          then:
            - logger.log: "USB power is active. The device skips deep sleep."
            - script.stop: enter_sleep

      - if:
          condition:
            lambda: |-
              return (id(is_button_wake) &&
                      millis() < ${min_awake_sec} * 1000UL);
          then:
            - delay: !lambda |-
                const uint32_t uptime_ms = millis();
                const uint32_t target_ms = ${min_awake_sec} * 1000UL;
                if (uptime_ms < target_ms) {
                  const uint32_t remaining_ms = target_ms - uptime_ms;
                  ESP_LOGI("sleep", "The device waits %" PRIu32 " ms to reach the minimum awake time.", remaining_ms);
                  return remaining_ms;
                }
                return 0;
            - wait_until:
                condition:
                  lambda: 'return !brd_power::epd_refresh_active;'
                timeout: 30s
            - script.execute: sample_batt
            - lambda: |-
                const uint32_t current_mv = brd_power::voltage_to_mv(id(batt_voltage).state);
                const bool sof_inc = brd_power::check_usb_sof_incremented();
                brd_power::rtc_state.staying_awake_usb = brd_power::evaluate_usb_power(
                    current_mv, brd_power::rtc_state.prev_batt_mv, brd_power::rtc_state.staying_awake_usb,
                    sof_inc, id(boot_prev_slept));
                brd_power::rtc_state.update_crc();

      - wait_until:
          condition:
            lambda: |-
              return brd_power::can_enter_sleep(false, id(brd_image_task).is_running(),
                                                brd_power::epd_refresh_active,
                                                brd_power::sleep_lock_count);
          timeout: 30s

      - if:
          condition:
            lambda: |-
              return !brd_power::can_enter_sleep(false, id(brd_image_task).is_running(),
                                                 brd_power::epd_refresh_active,
                                                 brd_power::sleep_lock_count);
          then:
            - logger.log: "Active work prevents deep sleep. The device defers sleep."
            - script.stop: enter_sleep

      - lambda: |-
          if (!brd_power::rtc_state.staying_awake_usb && brd_power::check_usb_sof_incremented()) {
            brd_power::rtc_state.staying_awake_usb = true;
            brd_power::rtc_state.update_crc();
          }

      - if:
          condition:
            lambda: 'return brd_power::rtc_state.staying_awake_usb;'
          then:
            - logger.log: "USB power is active. The device skips deep sleep."
            - script.stop: enter_sleep

      - lambda: |-
          id(awake_duration_sensor).publish_state(millis() / 1000.0f);

      - lambda: |-
          auto now_time = id(ntp_time).now();
          if (!now_time.is_valid()) {
            now_time = id(rtc_time).now();
          }
          const int64_t now_epoch = now_time.is_valid() ? now_time.timestamp : 0;
          const uint32_t fallback_sleep = std::max<uint32_t>(
              static_cast<uint32_t>(${short_sleep_time} > 0 ? ${short_sleep_time} : 1) * 60U,
              brd_schedule::MIN_FALLBACK_SLEEP_SEC);
          brd_schedule::EspHomeTzCalendar cal;
          brd_schedule::ScheduleConfig cfg;
          cfg.wake_hour = ${wake_at_hr};
          cfg.wake_minute = ${wake_at_min};
          cfg.sleep_hour = ${sleep_at_hr};
          cfg.sleep_minute = ${sleep_at_min};
          cfg.boundary_interval_min = ${short_sleep_time};
          cfg.fallback_sleep_sec = fallback_sleep;

          brd_schedule::SchedulePlan current_plan;
          current_plan.mode = id(next_wake_is_overnight) ? "alarm" : "timer";
          current_plan.target_epoch = id(next_wake_epoch);
          current_plan.arm_alarm = id(next_wake_alarm);
          current_plan.sleep_seconds = id(sleep_seconds);
          current_plan.clock_valid = (id(next_wake_epoch) != 0 && now_epoch > 0);

          const auto final_plan = brd_schedule::revalidate_before_sleep(cal, now_epoch, current_plan, cfg);
          const uint32_t clamped_sleep_sec =
              std::max<uint32_t>(final_plan.sleep_seconds, brd_schedule::MIN_FALLBACK_SLEEP_SEC);

          brd_rtc::EspHomeI2cAdapter i2c_bus(id(lilygo_t5_47_plus_i2c));
          brd_rtc::WakeSettings ws;
          ws.use_alarm = final_plan.arm_alarm && !id(rtc_clock_diverged);
          if (final_plan.arm_alarm && id(rtc_clock_diverged)) {
            ESP_LOGW("sleep", "The earlier RTC write failed. The firmware uses the countdown timer.");
          }
          ws.target_utc_hour = final_plan.target_utc_hour;
          ws.target_utc_minute = final_plan.target_utc_minute;
          ws.sleep_seconds = clamped_sleep_sec;
          if (!ws.use_alarm && ws.sleep_seconds > 15300U) {
            ESP_LOGW("sleep", "The RTC timer clamps %" PRIu32 " seconds to 15300 seconds.",
                     ws.sleep_seconds);
          }

          const bool rtc_arm_ok = brd_rtc::arm_wake(i2c_bus, ${rtc_i2c_addr}, ws);
          if (!rtc_arm_ok) {
            ESP_LOGW("sleep", "The firmware failed to arm the hardware RTC. The device uses the internal timer.");
            esp_sleep_enable_timer_wakeup(static_cast<uint64_t>(clamped_sleep_sec) * 1000000ULL);
          }

          id(touch).stop_poller();
          const int gt = brd_power::sleep_gt911_and_hold_int_low(
              i2c_bus, brd_power::rtc_state.last_gt911_addr);
          brd_power::rtc_state.prev_gt911 = static_cast<int8_t>(gt);
          if (gt > 0) {
            brd_power::rtc_state.last_gt911_addr = static_cast<int8_t>(gt);
          }
          brd_power::rtc_state.prev_slept = true;
          brd_power::rtc_state.update_crc();

          brd_power::prepare_esp32s3_deep_sleep_peripherals();
          brd_power::arm_deep_sleep_latch();

      - deep_sleep.enter:
          id: deep_sleep_1

display:
  - platform: lilygo_t5_47_plus
    id: t5_display
    update_interval: never
    rotation: 270°
    auto_clear_enabled: false

touchscreen:
  - platform: lilygo_t5_47_plus
    id: touch
    display: t5_display
    i2c_id: lilygo_t5_47_plus_i2c
    update_interval: 100ms
    transform:
      swap_xy: true
      mirror_y: true
    on_touch:
      - lambda: |-
          (void) touches;
          if (!brd_power::is_valid_touch_point(
                  touch.x, touch.y, id(t5_display).get_width(), id(t5_display).get_height())) {
            ESP_LOGW("touch", "The firmware ignored an out-of-bounds touch point (%d, %d).", touch.x, touch.y);
            return;
          }
          id(wake_touch_x) = touch.x;
          id(wake_touch_y) = touch.y;
          id(wake_touch_x_sensor).publish_state(touch.x);
          id(wake_touch_y_sensor).publish_state(touch.y);
          ESP_LOGI("touch", "The firmware recorded touch point (%d, %d).", touch.x, touch.y);
    on_release:
      - logger.log: "Touch contact ended."
